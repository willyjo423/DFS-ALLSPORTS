name: Props fetch

# Pulls Bovada's NBA and NHL player props on its own and commits the day's
# file under docs/data/props/, so a publish run whose own pull comes back
# empty (it happens) still has the afternoon's lines - goalie saves lines
# only go up once starters are known. Dispatched by the slate clock.

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: props-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Fetch
        run: |
          python3 - <<'PY'
          import logging, time
          from datetime import datetime, timedelta, timezone
          logging.basicConfig(level=logging.INFO)
          import nba_props, nhl_props
          day = datetime.now(timezone(timedelta(hours=-5))).date().isoformat()
          for mod in (nhl_props, nba_props):
              for i in range(4):
                  try:
                      got = mod.fetch()
                  except Exception as e:
                      print(mod.__name__, "error", e); got = {}
                  print(mod.__name__, "try", i, len(got))
                  if got:
                      break
                  time.sleep(20 * (i + 1))
              if got:
                  mod._CACHE.clear() if hasattr(mod, "_CACHE") else None
                  orig = mod.fetch
                  mod.fetch = lambda g=got: g
                  mod.load(day)
                  mod.fetch = orig
          PY
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A docs/data/props
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "Props: $(date -u +%Y-%m-%d\ %H:%M)"
          for i in 1 2 3 4 5; do
            git pull --rebase -X ours origin main && git push && exit 0
            sleep $((i * 8))
          done
          exit 1
