name: probe dfo
on: {push: {branches: [probe-dfo]}, workflow_dispatch: {}}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feat/nhl-props2}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: |
          python3 - <<'PY'
          import logging; logging.basicConfig(level=logging.INFO)
          import nhl_props as P, collections
          d = {}
          for i in range(3):
              try:
                  d = P.fetch()
              except Exception as e: print("ERR", e)
              print("TRY", i, len(d))
              if d: break
          c = collections.Counter(s for v in d.values() for s in v)
          print("STATS", c)
          print("SV", [(k, v["SV"]) for k, v in d.items() if "SV" in v][:10])
          PY
