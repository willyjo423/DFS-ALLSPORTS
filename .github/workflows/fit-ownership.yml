name: Fit ownership

on:
  push:
    paths: ["data/contests/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fit-ownership
  cancel-in-progress: false

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fit
        run: |
          python fit_ownership.py --auto 2>&1 | tee fit.txt
          { echo '### Ownership fit'; echo '```'; cat fit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -f data/ownership_fit_*.json 2>/dev/null || true
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "Ownership fit: $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do git pull --rebase --autostash -X ours origin main && git push && exit 0; sleep 10; done
          exit 1
