name: probe dfo
on: {push: {branches: [probe-dfo]}, workflow_dispatch: {}}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q pandas numpy requests
      - run: |
          python3 - <<'PY'
          import datetime as dt, pandas as pd, nba_fetch as F, time
          rows=[]
          for g in F.games_on(dt.date(2026,11,19)):
              rows += F.parse(F._get(F.SUMMARY, event=g["id"]), g["id"], g["date"]); time.sleep(0.5)
          df=pd.DataFrame(rows); df["dk"]=F.dk_points(df)
          print("ROWS", len(df), df["game_id"].nunique())
          for r in df.itertuples():
              print("P|%s|%s|%s|%s|%s|%.2f" % (r.name, r.team, r.played, r.starter, r.min, r.dk))
          PY
