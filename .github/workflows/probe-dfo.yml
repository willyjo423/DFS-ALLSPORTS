name: probe dfo
on:
  push:
    branches: [probe-dfo]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install requests -q
      - run: |
          python3 - <<'PY'
          import urllib.request, requests, time
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          for u in ["https://www.dailyfaceoff.com/starting-goalies", "https://www.dailyfaceoff.com/starting-goalies/2026-11-17", "https://www.dailyfaceoff.com/teams/ottawa-senators/line-combinations"]:
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": UA}), timeout=30); print("urllib", r.status, u)
              except Exception as e: print("urllib", e, u)
              time.sleep(1)
              r = requests.get(u, headers={"User-Agent": UA}, timeout=30); print("requests", r.status_code, u)
              time.sleep(1)
              r = requests.get(u, headers={"User-Agent": UA, "Accept": "text/html,application/xhtml+xml", "Accept-Language": "en-US,en;q=0.9", "Accept-Encoding": "identity"}, timeout=30); print("requests+hdr", r.status_code, u)
              time.sleep(1)
          PY
