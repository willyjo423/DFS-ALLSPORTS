name: probe dfo
on:
  push:
    branches: [probe-dfo]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, re, urllib.request
          def get(u):
              r = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"})
              return urllib.request.urlopen(r, timeout=30).read().decode()
          def shape(o, d=0, k=""):
              pad = "  " * d
              if d > 6: return
              if isinstance(o, dict):
                  for kk, v in list(o.items())[:40]:
                      if isinstance(v, (dict, list)):
                          print(f"{pad}{kk}: {type(v).__name__}{'['+str(len(v))+']' if isinstance(v,list) else ''}")
                          shape(v, d+1)
                      else:
                          print(f"{pad}{kk} = {str(v)[:80]!r}")
              elif isinstance(o, list) and o:
                  shape(o[0], d+1)
          import collections
          c=collections.Counter(); inj=collections.Counter(); upd=[]
          for slug in ["ottawa-senators","boston-bruins","edmonton-oilers","tampa-bay-lightning","toronto-maple-leafs"]:
              h=get(f"https://www.dailyfaceoff.com/teams/{slug}/line-combinations")
              m=re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', h, re.S)
              cb=json.loads(m.group(1))["props"]["pageProps"]["combinations"]
              upd.append((slug, cb.get("updatedAt")))
              for p in cb["players"]:
                  c[(p.get("groupIdentifier"),p.get("categoryIdentifier"))]+=1
                  inj[(p.get("injuryStatus"),p.get("gameTimeDecision"))]+=1
                  if p.get("injuryStatus"): print("INJ", slug, p["name"], p.get("groupIdentifier"), p.get("injuryStatus"))
          print(upd); print(sorted(c.items(), key=str)); print(inj)
          PY
