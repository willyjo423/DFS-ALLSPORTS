name: probe dfo
on:
  push:
    branches: [probe-dfo]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          for dg in (156626, 156831):
              d = json.loads(urllib.request.urlopen(urllib.request.Request(f"https://www.draftkings.com/lineup/getavailableplayers?draftGroupId={dg}", headers={"User-Agent": UA}), timeout=30).read())
              pl = sorted(d["playerList"], key=lambda p: -p.get("s", 0))[:8]
              for p in pl:
                  print("P", dg, p["fn"], p["ln"], {k: p.get(k) for k in ("s", "ppg", "or", "swp", "ipc", "pp", "i", "dgst", "slo")})
          PY
