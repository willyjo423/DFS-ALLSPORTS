name: Slate clock

# GitHub's own scheduler can run hours late (2026-11-18: a 10:20 UTC job ran
# at 18:53 and no publish cron fired all day). This job keeps its own clock:
# once started it dispatches the publish workflows at fixed Eastern times,
# then re-dispatches itself for the rest of the day. The crons in the publish
# workflows stay as a second line.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "5 14 * * *"     # ~9:05am ET start; late is fine, it catches up

permissions:
  actions: write
  contents: read

concurrency:
  group: slate-clock
  cancel-in-progress: false

jobs:
  clock:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Install requests for the news watcher
        run: python3 -m pip install --quiet requests || true
      - name: Dispatch publishes on time
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, subprocess, time
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          ET = ZoneInfo("America/New_York")
          # (HH:MM Eastern, workflow file)
          # A "!" marks a lock-time run: only the slate locking next, so it
          # finishes in a couple of minutes instead of rebuilding every slate.
          PLAN = [(t, "nba-publish.yml") for t in
                  ("10:37", "13:37", "16:33", "17:08", "17:41", "18:12", "18:30",
                   "!18:47", "!19:17", "!19:47", "20:13", "!21:40")]
          PLAN += [(t, "nhl-publish.yml") for t in
                   ("11:15", "15:00", "17:10", "18:05", "!18:40", "!19:08", "!19:38", "21:30")]
          PLAN += [("09:10", "nba-fetch.yml"), ("09:25", "nightly-grade.yml")]
          PLAN += [(t, "props-fetch.yml") for t in
                   ("10:20", "12:50", "15:50", "16:58", "17:58", "18:24", "18:55", "19:25")]
          PLAN += [(t, "cfb-publish.yml") for t in ("09:43", "11:38", "14:48", "18:43")]
          # Friday (and Thursday) night college slates: afternoon and pre-lock.
          PLAN += [(t, "cfb-weeknight") for t in ("13:43", "18:20")]
          def season(wf, d):
              if wf == "cfb-weeknight":
                  return d.weekday() in (3, 4) and d.month in (8, 9, 10, 11, 12)
              if wf == "cfb-publish.yml":
                  return d.weekday() == 5 and d.month in (8, 9, 10, 11, 12, 1)
              return d.month in (10, 11, 12, 1, 2, 3, 4, 5, 6)
          def fire(wf, soon=False):
              wf = "cfb-publish.yml" if wf == "cfb-weeknight" else wf
              mins = 28 if soon is True else soon
              extra = ["-f", f"inputs[soon]={mins}"] if mins else []
              r = subprocess.run(["gh", "api", "-X", "POST",
                                  f"repos/{os.environ['REPO']}/actions/workflows/{wf}/dispatches",
                                  "-f", "ref=main"] + extra, capture_output=True, text=True)
              print(datetime.now(ET).strftime("%H:%M"), "dispatch", wf, "ok" if r.returncode == 0 else r.stderr[:200], flush=True)
          try:
              import news_watch
              WATCH = news_watch.Watcher()
          except Exception as exc:
              print("news watcher off:", exc, flush=True)
              WATCH = None
          LAST_NEWS_FIRE = {}
          PENDING_NEWS = set()
          STEP = 3 * 60      # how often late news is checked
          def watch_news():
              t = datetime.now(ET)
              if WATCH is None or not (11 <= t.hour < 23):
                  return
              for sport, moved in WATCH.changes().items():
                  if sport == "nhl" and not season("nhl-publish.yml", t.date()):
                      continue
                  print(t.strftime("%H:%M"), "late news", sport, "; ".join(moved)[:300], flush=True)
                  PENDING_NEWS.add(sport)
              # News inside the cooldown is held, not dropped: it fires as
              # soon as the cooldown ends.
              for sport in sorted(PENDING_NEWS):
                  if time.time() - LAST_NEWS_FIRE.get(sport, 0) < 8 * 60:
                      continue
                  PENDING_NEWS.discard(sport)
                  LAST_NEWS_FIRE[sport] = time.time()
                  fire(f"{sport}-publish.yml", 90)
          start = time.time()
          now = datetime.now(ET)
          todo = []
          for day in (now.date(), now.date() + timedelta(days=1)):
              for hm, wf in PLAN:
                  lock = hm.startswith("!")
                  h, m = map(int, hm.lstrip("!").split(":"))
                  if season(wf, day):
                      todo.append((datetime(day.year, day.month, day.day, h, m, tzinfo=ET), wf, lock))
          todo.sort()
          # Catch up once: the most recent missed run of each workflow.
          for wf in {w for _, w, _ in todo}:
              past = [a for a, w, lk in todo if w == wf and a <= now and not lk]
              if past and now - past[-1] < timedelta(hours=3):
                  fire(wf)
          todo = [t for t in todo if t[0] > now]
          # Runs back to back for good: before the 6-hour job limit it starts
          # its successor, overnight included, so it never waits on GitHub's
          # cron to start the day (which did not fire at all on 2026-11-19).
          while True:
              nxt = todo[0][0] if todo else now + timedelta(hours=12)
              wait = (nxt - datetime.now(ET)).total_seconds()
              if time.time() - start + max(wait, 0) > 340 * 60 or not todo:
                  left = 340 * 60 - (time.time() - start)
                  while left > 0 and todo:      # keep watching news while waiting
                      time.sleep(min(left, STEP))
                      left -= STEP
                      watch_news()
                  print("handing over to a fresh clock run", flush=True)
                  fire("slate-clock.yml")
                  break
              # Sleep in short steps and watch for late news in between: an
              # NBA scratch or a confirmed NHL goalie triggers a lock-lane
              # rebuild of whatever locks in the next 90 minutes.
              while wait > 0:
                  step = min(wait, STEP)
                  time.sleep(step)
                  wait -= step
                  watch_news()
              at, wf, lock = todo.pop(0)
              fire(wf, lock)
          PY
