name: probe dfo
on:
  push:
    branches: [probe-dfo]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import re, urllib.request
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          for u in ["https://www.linestarapp.com/Ownership/Sport/NBA/Site/DraftKings",
                    "https://www.linestarapp.com/Ownership/Sport/NHL/Site/DraftKings"]:
              try:
                  h = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": UA}), timeout=30).read().decode("utf-8","ignore")
              except Exception as e:
                  print("FAIL", u, str(e)[:80]); continue
              print("OK", u, len(h))
              text = re.sub(r"\s+"," ",re.sub(r"<[^>]+>"," ",re.sub(r"<script.*?</script>","",h,flags=re.S)))
              i = text.find("Actual"); print("  TEXT", text[i:i+900])
              apis = sorted(set(re.findall(r'["\'](/[A-Za-z/_]*(?:Api|API|api)[^"\']{0,120})["\']', h)))[:20]
              print("  APIS", apis)
              pids = re.findall(r'(?:periodId|PeriodId|pid)\W{0,3}(\d{3,6})', h)[:5]
              print("  PIDS", pids)
          PY
