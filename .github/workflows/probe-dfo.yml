name: probe dfo
on:
  push:
    branches: [probe-dfo]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          def get(u, h=None):
              try:
                  hd = {"User-Agent": UA, "Accept": "application/json, text/html", "Referer": "https://www.nba.com/"}; hd.update(h or {})
                  r = urllib.request.urlopen(urllib.request.Request(u, headers=hd), timeout=30)
                  return r.status, r.read()
              except Exception as e:
                  return str(e)[:100], b""
          for day in ("20261117", "20261118"):
              s, b = get(f"https://stats.nba.com/js/data/leaders/00_daily_lineups_{day}.json")
              print("NBA DAILY", day, s, len(b))
              if b:
                  d = json.loads(b); g = d.get("games", [])
                  print("  games", len(g), json.dumps(g[0])[:700] if g else "")
          s, b = get("https://www.rotowire.com/basketball/nba-lineups.php")
          print("ROTOWIRE", s, len(b), b"is-confirmed" in b, b"lineup__player" in b)
          s, b = get("https://www.lineups.com/nba/lineups")
          print("LINEUPSCOM", s, len(b))
          PY
