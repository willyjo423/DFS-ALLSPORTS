name: probe dfo
on:
  push:
    branches: [probe-dfo]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request, time
          def get(u):
              return json.loads(urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent":"Mozilla/5.0"}), timeout=30).read())
          sc = get("https://api-web.nhle.com/v1/score/2026-11-17")
          print("GAMES", len(sc["games"]))
          for g in sc["games"]:
              b = get(f"https://api-web.nhle.com/v1/gamecenter/{g['id']}/boxscore")
              for side in ("awayTeam", "homeTeam"):
                  t = b[side]["abbrev"]; st = b["playerByGameStats"][side]
                  for grp in ("forwards", "defense"):
                      for p in st.get(grp, []):
                          print("ROW|%s|%s|%d|%d|%d|%d|%d" % ((p.get("name") or {}).get("default"), t, p.get("goals",0), p.get("assists",0), p.get("sog",0), p.get("blockedShots",0), p.get("shorthandedGoals",0) if "shorthandedGoals" in p else 0))
              time.sleep(0.4)
          PY
