name: probe dfo
on: {push: {branches: [probe-dfo]}, workflow_dispatch: {}}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request, collections
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          def get(u):
              return json.loads(urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": UA, "Accept": "application/json"}), timeout=30).read())
          b = get("https://www.bovada.lv/services/sports/event/coupon/events/A/description/hockey/nhl?marketFilterId=def&preMatchOnly=true&lang=en")
          evs = [e for blk in b for e in blk["events"]]; print("EVENTS", len(evs))
          kinds = collections.Counter(); per = []
          for e in evs:
              full = get("https://www.bovada.lv/services/sports/event/v2/events/A/description" + e["link"] + "?lang=en")
              ev = full[0]["events"][0]; n = 0
              for g in ev["displayGroups"]:
                  for m in g["markets"]:
                      if "Player" in g["description"] or " - " in m["description"]:
                          k = (g["description"], m["description"].split(" - ")[0]); kinds[k] += 1; n += 1
                          if kinds[k] == 1:
                              print("MKT", g["description"], "|", m["description"], [(o.get("description"), (o.get("price") or {}).get("handicap"), (o.get("price") or {}).get("american")) for o in m["outcomes"][:4]])
              per.append((e["description"], n))
          print("PER", per)
          for k, v in kinds.most_common(40): print("KIND", k, v)
          PY
