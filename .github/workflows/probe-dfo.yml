name: probe dfo
on:
  push:
    branches: [probe-dfo]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -o /tmp/e.json -w "ESPN %{http_code}\n" -A "Mozilla/5.0" "https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard?dates=20261118"
          python3 -c "import json; d=json.load(open('/tmp/e.json')); print('GAMES', len(d['events']), [(e['shortName'], (e['competitions'][0].get('odds') or [{}])[0].get('details')) for e in d['events']][:5])"
