name: probe dfo
on:
  push:
    branches: [probe-dfo]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          def get(u):
              r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": UA, "Accept": "application/json"}), timeout=30)
              return json.loads(r.read())
          b = get("https://www.bovada.lv/services/sports/event/coupon/events/A/description/basketball/nba?marketFilterId=def&preMatchOnly=true&lang=en")
          evs = b[0]["events"]
          print("EVENTS", len(evs), [(e["description"], e["link"]) for e in evs[:3]])
          link = evs[0]["link"]
          full = get("https://www.bovada.lv/services/sports/event/v2/events/A/description" + link + "?lang=en")
          ev = full[0]["events"][0]
          groups = ev["displayGroups"]
          print("GROUPS", [g["description"] for g in groups])
          for g in groups:
              if "Player" in g["description"] or "Prop" in g["description"]:
                  ms = g["markets"]
                  print("GROUP", g["description"], len(ms))
                  for m in ms[:6]:
                      print("  MKT", m["description"], [(o["description"], (o.get("price") or {}).get("american"), (o.get("price") or {}).get("handicap")) for o in m["outcomes"]][:3])
          PY
