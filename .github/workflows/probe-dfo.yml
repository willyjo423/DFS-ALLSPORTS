name: probe dfo
on: {push: {branches: [probe-dfo]}, workflow_dispatch: {}}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {repository: willyjo423/NFL-DFS, ref: feat/sync-allsports}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q -r requirements.txt
      - run: |
          python3 - <<'PY'
          import data
          w = data.player_weeks([2026])
          print("COLS", [c for c in w.columns if c in ("team","season","week","player_id","name","position")])
          print("MAXWEEK", w["week"].max(), sorted(w["week"].unique()))
          for n in ["Jalen Hurts","De'Von Achane","DeVonta Smith","James Conner","Mike Evans","Christian McCaffrey","Joe Burrow"]:
              r = w[w["name"]==n]
              print("P", n, r[["player_id","team","week"]].values.tolist()[-12:])
          print("PHI weeks", sorted(w[w["team"]=="PHI"]["week"].unique()))
          PY
