name: probe dfo
on:
  push:
    branches: [probe-dfo]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          def get(u):
              return json.loads(urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent":"Mozilla/5.0"}), timeout=30).read())
          s = get("https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event=401909994")
          print("SUMMARY KEYS", list(s))
          bp = s["boxscore"]["players"][0]
          print("TEAM", bp["team"]["abbreviation"])
          st = bp["statistics"][0]
          print("STATKEYS", list(st)); print("LABELS", st.get("labels")); print("NAMES", st.get("names"))
          a = st["athletes"][0]; print("ATH", json.dumps({k: a[k] for k in a if k != "athlete"})[:400]); print("ATHL", json.dumps(a["athlete"])[:300])
          dnp = [x for x in st["athletes"] if x.get("didNotPlay")][:2]; print("DNP", json.dumps(dnp)[:500])
          print("PICK", json.dumps(s.get("pickcenter"))[:700])
          print("ODDS", json.dumps(s.get("odds"))[:300])
          inj = get("https://site.api.espn.com/apis/site/v2/sports/basketball/nba/injuries")
          t = inj["injuries"][0]; print("INJ TEAM", t.get("displayName"), json.dumps(t["injuries"][0])[:600])
          sb = get("https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=20251201")
          print("OLD SEASON GAMES", len(sb["events"]), sb["events"][0]["id"])
          c = get("https://www.draftkings.com/lobby/getcontests?sport=NBA")
          dgs = c.get("DraftGroups") or []
          print("DK NBA DGS", len(dgs), [(g.get("DraftGroupId"), g.get("GameTypeId"), g.get("StartDateEst"), g.get("ContestStartTimeSuffix")) for g in dgs[:8]])
          if dgs:
              dg = dgs[0]["DraftGroupId"]
              d = get(f"https://api.draftkings.com/draftgroups/v1/draftgroups/{dg}/draftables")
              r = d["draftables"][0]
              print("DRAFTABLE", json.dumps({k: r[k] for k in r if k not in ("draftStatAttributes","playerAttributes","teamLeagueSeasonAttributes","playerGameAttributes")})[:700])
          PY
